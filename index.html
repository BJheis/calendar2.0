<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>017 的心情日历</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0b1a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 12px;
  }
  .container {
    background: #1a1a2e;
    border-radius: 28px;
    padding: 20px 16px 18px;
    width: 100%;
    max-width: 600px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    color: #d0d8e8;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .header .month-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .month {
    font-size: 20px;
    font-weight: 300;
    letter-spacing: 1px;
    color: #ffe8b0;
  }
  .header .nav {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .header .nav button {
    background: transparent;
    border: 1px solid #3a3a5c;
    color: #8a9aaa;
    padding: 3px 12px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.3s;
  }
  .header .nav button:hover {
    border-color: #ffe8b0;
    color: #ffe8b0;
    background: rgba(255,255,255,0.04);
  }
  .header .nav .today-btn {
    border-color: #ffe8b0;
    color: #ffe8b0;
    font-size: 12px;
    padding: 3px 14px;
  }
  .header .nav .today-btn:hover {
    background: rgba(255,232,176,0.15);
  }

  .weekday {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    color: #6a7a8a;
    font-size: 12px;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .grid-wrapper {
    overflow: hidden;
    position: relative;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    transition: opacity 0.25s ease;
  }
  .grid.fade-out {
    opacity: 0;
  }
  .grid.fade-in {
    opacity: 1;
  }

  .cell {
    aspect-ratio: 1 / 1.05;
    background: #1e1e32;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #d0d8e8;
    cursor: pointer;
    transition: 0.2s;
    user-select: none;
    border: 1px solid transparent;
    position: relative;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 2px;
    min-width: 0;
    font-weight: 500;
  }
  .cell.has-mood {
    font-size: clamp(11px, 1.8vw, 16px);
    letter-spacing: 0;
    font-weight: 500;
  }
  .cell:hover { border-color: #4a4a6a; background: #26263e; }
  .cell.empty { opacity: 0.2; pointer-events: none; }
  .cell.has-mood { border-color: #4a4a6a; }

  .footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #4a5a6a;
    flex-wrap: wrap;
    gap: 8px;
  }
  .footer .left-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .footer .btn-action {
    background: transparent;
    border: 1px solid #3a3a5c;
    color: #8a9aaa;
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.3s;
  }
  .footer .btn-action:hover {
    border-color: #ffe8b0;
    color: #ffe8b0;
    background: rgba(255,255,255,0.04);
  }
  .footer .clear-btn {
    background: transparent;
    border: none;
    color: #4a5a6a;
    cursor: pointer;
    font-size: 11px;
    transition: 0.3s;
  }
  .footer .clear-btn:hover { color: #8a7a7a; }
  .legend {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .legend span {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 11px;
    color: #6a7a8a;
  }
  .legend .dot {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 6px;
  }

  /* 统计栏 */
  .stats-bar {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 16px;
    border: 1px solid #3a3a5c;
    transition: 0.3s;
    background: transparent;
    color: #8a9aaa;
    font-size: 11px;
  }
  .stats-bar:hover {
    border-color: #ffe8b0;
    color: #ffe8b0;
    background: rgba(255,255,255,0.04);
  }
  .stats-bar .num {
    color: #ffe8b0;
    font-weight: 600;
  }

  /* 隐藏的文件输入 */
  #fileInput {
    display: none;
  }

  /* Toast 提示 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #2a2a4a;
    color: #d0d8e8;
    padding: 12px 24px;
    border-radius: 20px;
    border: 1px solid #4a4a6a;
    font-size: 14px;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show {
    opacity: 1;
  }

  /* ========== 统计弹窗 ========== */
  .stats-modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    justify-content: center;
    align-items: center;
    z-index: 300;
  }
  .stats-modal.open {
    display: flex;
  }
  .stats-box {
    background: #1a1a2e;
    border-radius: 28px;
    padding: 24px 20px 20px;
    max-width: 420px;
    width: 92%;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8);
    border: 1px solid #2a2a44;
  }
  .stats-box::-webkit-scrollbar {
    width: 4px;
  }
  .stats-box::-webkit-scrollbar-track {
    background: transparent;
  }
  .stats-box::-webkit-scrollbar-thumb {
    background: #3a3a5c;
    border-radius: 4px;
  }

  .stats-box .stats-title {
    color: #ffe8b0;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 1px;
    text-align: center;
    margin-bottom: 16px;
  }
  .stats-box .stats-close {
    float: right;
    background: transparent;
    border: none;
    color: #6a7a8a;
    font-size: 20px;
    cursor: pointer;
    transition: 0.3s;
    line-height: 1;
  }
  .stats-box .stats-close:hover {
    color: #ffe8b0;
  }

  /* 统计 Tab 切换 */
  .stats-tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .stats-tabs button {
    background: transparent;
    border: 1px solid #3a3a5c;
    color: #8a9aaa;
    padding: 4px 18px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.3s;
  }
  .stats-tabs button.active {
    border-color: #ffe8b0;
    color: #ffe8b0;
    background: rgba(255,232,176,0.08);
  }
  .stats-tabs button:hover {
    border-color: #ffe8b0;
    color: #ffe8b0;
  }

  /* 统计列表 - Q弹动画 */
  .stats-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stats-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: #1e1e32;
    border-radius: 12px;
    border: 1px solid #2a2a44;
    opacity: 0;
    transform: scale(0.8) translateY(10px);
    animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  .stats-item .emoji {
    font-size: 18px;
  }
  .stats-item .label {
    color: #8a9aaa;
    font-size: 13px;
    flex: 1;
    margin-left: 10px;
  }
  .stats-item .count {
    color: #ffe8b0;
    font-weight: 600;
    font-size: 15px;
    background: #2a2a44;
    padding: 0 12px;
    border-radius: 12px;
    line-height: 24px;
    min-width: 30px;
    text-align: center;
  }
  .stats-empty {
    text-align: center;
    color: #4a5a6a;
    padding: 30px 0;
    font-size: 14px;
  }

  @keyframes popIn {
    0% {
      opacity: 0;
      transform: scale(0.8) translateY(10px);
    }
    100% {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
  }

  /* 每个 item 延迟不同 */
  .stats-item:nth-child(1) { animation-delay: 0.02s; }
  .stats-item:nth-child(2) { animation-delay: 0.06s; }
  .stats-item:nth-child(3) { animation-delay: 0.10s; }
  .stats-item:nth-child(4) { animation-delay: 0.14s; }
  .stats-item:nth-child(5) { animation-delay: 0.18s; }
  .stats-item:nth-child(6) { animation-delay: 0.22s; }
  .stats-item:nth-child(7) { animation-delay: 0.26s; }
  .stats-item:nth-child(8) { animation-delay: 0.30s; }
  .stats-item:nth-child(9) { animation-delay: 0.34s; }
  .stats-item:nth-child(10) { animation-delay: 0.38s; }
  .stats-item:nth-child(11) { animation-delay: 0.42s; }
  .stats-item:nth-child(12) { animation-delay: 0.46s; }
  .stats-item:nth-child(13) { animation-delay: 0.50s; }
  .stats-item:nth-child(14) { animation-delay: 0.54s; }
  .stats-item:nth-child(15) { animation-delay: 0.58s; }

  /* 小屏适配 */
  @media (max-width: 480px) {
    .container {
      padding: 16px 10px 14px;
      border-radius: 22px;
      max-width: 100%;
    }
    .grid {
      gap: 5px;
    }
    .cell.has-mood {
      font-size: clamp(10px, 2.2vw, 14px);
    }
    .cell {
      font-size: 13px;
    }
    .weekday {
      font-size: 11px;
    }
    .footer .left-actions {
      gap: 6px;
    }
    .footer .btn-action {
      font-size: 10px;
      padding: 3px 10px;
    }
    .stats-bar {
      font-size: 10px;
      padding: 3px 10px;
    }
    .header .month {
      font-size: 17px;
    }
    .header .nav button {
      font-size: 12px;
      padding: 2px 10px;
    }
    .header .nav .today-btn {
      font-size: 11px;
      padding: 2px 12px;
    }
    .stats-box {
      padding: 18px 14px 16px;
    }
  }

  @media (max-width: 380px) {
    .grid {
      gap: 4px;
    }
    .cell.has-mood {
      font-size: clamp(9px, 2vw, 12px);
    }
    .cell {
      font-size: 12px;
      border-radius: 8px;
    }
  }

  @media (min-width: 601px) {
    .container {
      max-width: 700px;
      padding: 30px 24px 24px;
    }
    .grid {
      gap: 8px;
    }
    .cell.has-mood {
      font-size: clamp(14px, 1.6vw, 20px);
    }
    .cell {
      font-size: 18px;
      border-radius: 16px;
    }
    .weekday {
      font-size: 14px;
    }
    .stats-item .emoji {
      font-size: 22px;
    }
    .stats-item .label {
      font-size: 15px;
    }
  }
</style>
</head>
<body>

<div class="container" id="app">
  <div class="header">
    <div class="month-area">
      <div class="month" id="monthLabel">2026年8月</div>
    </div>
    <div class="nav">
      <button id="todayBtn" class="today-btn">✨ 今天</button>
      <button id="prevMonth">◀</button>
      <button id="nextMonth">▶</button>
    </div>
  </div>
  <div class="weekday">
    <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
  </div>
  <div class="grid-wrapper">
    <div class="grid" id="grid"></div>
  </div>
  <div class="footer">
    <div class="left-actions">
      <div class="legend">
        <span><span class="dot" style="background:#f0e6a0;"></span>开心</span>
        <span><span class="dot" style="background:#9ab8d9;"></span>平静</span>
        <span><span class="dot" style="background:#d9b8c8;"></span>难过</span>
        <span><span class="dot" style="background:#d9a0a0;"></span>生气</span>
      </div>
    </div>
    <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
      <!-- 统计栏 - 点击弹出统计 -->
      <div class="stats-bar" id="statsBar">
        📊 本月 <span class="num" id="monthCount">0</span> 天
      </div>
      <button class="btn-action" id="exportBtn">📤 导出</button>
      <button class="btn-action" id="importBtn">📥 导入</button>
      <button class="clear-btn" id="clearMonth">清空本月</button>
    </div>
  </div>
</div>

<!-- 心情选择弹窗 -->
<div class="mood-picker" id="picker">
  <div class="mood-box">
    <div class="date-label" id="pickerDate">8月20日</div>
    <div class="mood-grid" id="moodGrid"></div>
    <button class="mood-close" id="pickerClose">取消</button>
  </div>
</div>

<!-- 统计弹窗 -->
<div class="stats-modal" id="statsModal">
  <div class="stats-box">
    <button class="stats-close" id="statsClose">✕</button>
    <div class="stats-title">📊 心情统计报告</div>
    <div class="stats-tabs">
      <button class="active" data-tab="month">本月</button>
      <button data-tab="total">总计</button>
    </div>
    <div class="stats-list" id="statsList"></div>
  </div>
</div>

<!-- 隐藏的文件输入 -->
<input type="file" id="fileInput" accept=".json">

<!-- Toast 提示 -->
<div class="toast" id="toast"></div>

<script>
  // ---------- 颜文字列表 ----------
  const MOODS = [
    { key: '迷茫', emoji: '(o_o)…' },
    { key: '震惊', emoji: '(O_o)!' },
    { key: '心动', emoji: '(owo)♡' },
    { key: '开心', emoji: '(ovo)' },
    { key: '不开心', emoji: '(x_x)' },
    { key: '惊喜', emoji: '(ovo)!' },
    { key: '崩溃', emoji: '(T﹏T)' },
    { key: '别扭', emoji: '(ono)' },
    { key: '生气', emoji: '(◣_◢)' },
    { key: '无语', emoji: '(-_-)' },
    { key: '平静', emoji: '(-v-)' },
    { key: '犯困', emoji: '(--)zzz' },
    { key: '害羞', emoji: '(>m<)' },
    { key: '感动', emoji: '(QuQ)' },
    { key: '疑惑', emoji: '(O_o)?' }
  ];

  // 颜色映射
  const COLOR_MAP = {
    '(ovo)': '#f0e6a0',
    '(ovo)!': '#f0d070',
    '(owo)♡': '#f0b0c0',
    '(o_o)…': '#c0c8d8',
    '(O_o)!': '#e0c080',
    '(x_x)': '#d9b8c8',
    '(T﹏T)': '#d0a0b0',
    '(ono)': '#b8b0c8',
    '(◣_◢)': '#d9a0a0',
    '(-_-)': '#b0b8c8',
    '(-v-)': '#9ab8d9',
    '(--)zzz': '#b0b8c0',
    '(>m<)': '#f0b0b0',
    '(QuQ)': '#f0d0a0',
    '(O_o)?': '#c8b890'
  };

  // ---------- 状态 ----------
  // 自动获取当前系统时间
  const now = new Date();
  let currentYear = now.getFullYear();
  let currentMonth = now.getMonth();
  let selectedDate = null;
  let isAnimating = false;

  // ---------- DOM ----------
  const grid = document.getElementById('grid');
  const monthLabel = document.getElementById('monthLabel');
  const picker = document.getElementById('picker');
  const pickerDate = document.getElementById('pickerDate');
  const moodGrid = document.getElementById('moodGrid');
  const pickerClose = document.getElementById('pickerClose');
  const fileInput = document.getElementById('fileInput');
  const toast = document.getElementById('toast');
  const statsBar = document.getElementById('statsBar');
  const monthCount = document.getElementById('monthCount');
  const statsModal = document.getElementById('statsModal');
  const statsList = document.getElementById('statsList');
  const statsClose = document.getElementById('statsClose');

  // ---------- Toast 提示 ----------
  let toastTimer = null;

  function showToast(msg, duration = 2000) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove('show');
    }, duration);
  }

  // ---------- 存储 ----------
  function getKey(year, month, day) {
    return `mood_${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }

  function loadMood(year, month, day) {
    const key = getKey(year, month, day);
    return localStorage.getItem(key) || null;
  }

  function saveMood(year, month, day, val) {
    const key = getKey(year, month, day);
    if (val) {
      localStorage.setItem(key, val);
    } else {
      localStorage.removeItem(key);
    }
  }

  function clearMonth(year, month) {
    const days = new Date(year, month + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const key = getKey(year, month, d);
      localStorage.removeItem(key);
    }
    render();
    updateStats();
    showToast(`已清空 ${year}年 ${month+1}月 的记录`);
  }

  // ---------- 统计数据 ----------
  function getMonthStats(year, month) {
    const days = new Date(year, month + 1, 0).getDate();
    const stats = {};
    let count = 0;
    for (let d = 1; d <= days; d++) {
      const mood = loadMood(year, month, d);
      if (mood) {
        stats[mood] = (stats[mood] || 0) + 1;
        count++;
      }
    }
    return { stats, count };
  }

  function getTotalStats() {
    const stats = {};
    let count = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('mood_')) {
        const val = localStorage.getItem(key);
        if (val) {
          stats[val] = (stats[val] || 0) + 1;
          count++;
        }
      }
    }
    return { stats, count };
  }

  function updateStats() {
    const { count } = getMonthStats(currentYear, currentMonth);
    monthCount.textContent = count;
  }

  // ---------- 渲染统计弹窗 ----------
  function renderStats(tab = 'month') {
    const data = tab === 'month' 
      ? getMonthStats(currentYear, currentMonth) 
      : getTotalStats();
    
    const { stats } = data;
    const entries = MOODS.map(m => ({
      ...m,
      count: stats[m.emoji] || 0
    })).filter(m => m.count > 0);

    if (entries.length === 0) {
      statsList.innerHTML = `<div class="stats-empty">📭 还没有心情记录哦～</div>`;
      return;
    }

    // 按次数从高到低排序
    entries.sort((a, b) => b.count - a.count);

    statsList.innerHTML = entries.map((item, index) => `
      <div class="stats-item" style="animation-delay: ${(index * 0.04).toFixed(2)}s">
        <span class="emoji">${item.emoji}</span>
        <span class="label">${item.key}</span>
        <span class="count">${item.count} 次</span>
      </div>
    `).join('');
  }

  // ---------- 渲染日历 ----------
  function render(animate = true) {
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

    monthLabel.textContent = `${currentYear}年 ${currentMonth+1}月`;

    // 更新统计
    updateStats();

    // 动画处理
    if (animate) {
      grid.classList.add('fade-out');
      setTimeout(() => {
        buildGrid(startOffset, daysInMonth);
        grid.classList.remove('fade-out');
        grid.classList.add('fade-in');
        setTimeout(() => {
          grid.classList.remove('fade-in');
        }, 300);
      }, 200);
    } else {
      buildGrid(startOffset, daysInMonth);
    }
  }

  function buildGrid(startOffset, daysInMonth) {
    grid.innerHTML = '';
    const total = Math.ceil((startOffset + daysInMonth) / 7) * 7;

    for (let i = 0; i < total; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (i < startOffset || i >= startOffset + daysInMonth) {
        cell.classList.add('empty');
        grid.appendChild(cell);
        continue;
      }
      const day = i - startOffset + 1;
      const mood = loadMood(currentYear, currentMonth, day);
      if (mood) {
        cell.textContent = mood;
        cell.classList.add('has-mood');
        const bg = COLOR_MAP[mood] || '#2a2a44';
        cell.style.background = bg;
        cell.style.color = '#0b0b1a';
      } else {
        cell.textContent = day;
        cell.style.background = '#1e1e32';
        cell.style.color = '#d0d8e8';
      }
      cell.addEventListener('click', () => {
        selectedDate = { year: currentYear, month: currentMonth, day };
        openPicker(selectedDate);
      });
      grid.appendChild(cell);
    }
  }

  // ---------- 选择器 ----------
  function openPicker(date) {
    const { year, month, day } = date;
    pickerDate.textContent = `${year}年 ${month+1}月${day}日`;
    moodGrid.innerHTML = '';
    MOODS.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'mood-btn';
      btn.innerHTML = `${m.emoji}<span class="label">${m.key}</span>`;
      btn.addEventListener('click', () => {
        saveMood(year, month, day, m.emoji);
        picker.classList.remove('open');
        render();
        showToast(`✅ 已记录 ${m.emoji} ${m.key}`);
      });
      moodGrid.appendChild(btn);
    });
    picker.classList.add('open');
  }

  // ---------- 跳转到今天 ----------
  function goToToday() {
    const today = new Date();
    currentYear = today.getFullYear();
    currentMonth = today.getMonth();
    render();
    showToast('✨ 已回到今天');
  }

  // ---------- 导出数据 ----------
  function exportData() {
    const data = {};
    let count = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key && key.startsWith('mood_')) {
        data[key] = localStorage.getItem(key);
        count++;
      }
    }

    if (count === 0) {
      showToast('没有数据可以导出');
      return;
    }

    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const now = new Date();
    const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
    a.download = `心情日历_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`✅ 成功导出 ${count} 条记录`);
  }

  // ---------- 导入数据 ----------
  function importData(file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const data = JSON.parse(e.target.result);
        let count = 0;
        let errorCount = 0;

        for (const [key, value] of Object.entries(data)) {
          if (key && key.startsWith('mood_') && typeof value === 'string') {
            const datePart = key.replace('mood_', '');
            if (/^\d{4}-\d{2}-\d{2}$/.test(datePart)) {
              localStorage.setItem(key, value);
              count++;
            } else {
              errorCount++;
            }
          } else {
            errorCount++;
          }
        }

        render();
        updateStats();
        if (errorCount > 0) {
          showToast(`⚠️ 导入完成：${count} 条成功，${errorCount} 条跳过（格式错误）`);
        } else {
          showToast(`✅ 成功导入 ${count} 条记录`);
        }
      } catch (err) {
        showToast('❌ 文件格式错误，请选择正确的 JSON 文件');
        console.error('导入错误:', err);
      }
    };
    reader.onerror = function() {
      showToast('❌ 读取文件失败');
    };
    reader.readAsText(file);
  }

  // ---------- 事件绑定 ----------
  document.getElementById('prevMonth').addEventListener('click', () => {
    if (currentMonth === 0) { currentMonth = 11; currentYear--; }
    else currentMonth--;
    render();
  });

  document.getElementById('nextMonth').addEventListener('click', () => {
    if (currentMonth === 11) { currentMonth = 0; currentYear++; }
    else currentMonth++;
    render();
  });

  document.getElementById('todayBtn').addEventListener('click', goToToday);

  pickerClose.addEventListener('click', () => {
    picker.classList.remove('open');
  });
  picker.addEventListener('click', (e) => {
    if (e.target === picker) picker.classList.remove('open');
  });

  document.getElementById('clearMonth').addEventListener('click', () => {
    if (confirm(`确定要清空 ${currentYear}年 ${currentMonth+1}月 的所有心情记录吗？`)) {
      clearMonth(currentYear, currentMonth);
    }
  });

  // 导出按钮
  document.getElementById('exportBtn').addEventListener('click', exportData);

  // 导入按钮
  document.getElementById('importBtn').addEventListener('click', () => {
    fileInput.click();
  });

  fileInput.addEventListener('change', function(e) {
    if (this.files && this.files.length > 0) {
      importData(this.files[0]);
    }
    this.value = '';
  });

  // ---------- 统计弹窗 ----------
  let currentStatsTab = 'month';

  statsBar.addEventListener('click', () => {
    statsModal.classList.add('open');
    renderStats(currentStatsTab);
  });

  statsClose.addEventListener('click', () => {
    statsModal.classList.remove('open');
  });

  statsModal.addEventListener('click', (e) => {
    if (e.target === statsModal) statsModal.classList.remove('open');
  });

  // Tab 切换
  document.querySelectorAll('.stats-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.stats-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatsTab = btn.dataset.tab;
      renderStats(currentStatsTab);
    });
  });

  // ---------- 初始渲染 ----------
  render(false);
  updateStats();
  showToast('💡 点击日期记录心情，点击「📊 本月 X 天」查看统计', 2500);
</script>
</body>
</html>
